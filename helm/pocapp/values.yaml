
replicaCount: 1

image:
  repository: healthz-api
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# Ative após validar a versão estável. weight é a porcentagem no HTTPRoute.
canary:
  enabled: false
  weight: 0
  image:
    repository: ""
    tag: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5

ingress:
  enabled: false

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - healthz.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80            
