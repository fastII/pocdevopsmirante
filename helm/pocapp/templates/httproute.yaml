{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "pocapp.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $canaryWeight := 0 -}}
{{- if .Values.canary.enabled -}}
  {{- $canaryWeight = int .Values.canary.weight -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "pocapp.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    - backendRefs:
        {{- if lt $canaryWeight 100 }}
        - name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: {{ sub 100 $canaryWeight }}
        {{- end }}
        {{- if gt $canaryWeight 0 }}
        - name: {{ include "pocapp.canaryFullname" $ }}
          port: {{ $svcPort }}
          weight: {{ $canaryWeight }}
        {{- end }}
      {{- with .matches }}
      matches:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .filters }}
      filters:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
