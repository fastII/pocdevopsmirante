{{- range (include "pocapp.workloads" . | fromYamlArray) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  {{- if .canary }}
  annotations:
    argocd.argoproj.io/sync-options: PruneLast=true
  {{- end }}
  labels:
    {{- include "pocapp.commonLabels" $ | nindent 4 }}
    {{- .selector | nindent 4 }}
spec:
  type: {{ if .canary }}ClusterIP{{ else }}{{ $.Values.service.type }}{{ end }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- .selector | nindent 4 }}
{{- end }}
