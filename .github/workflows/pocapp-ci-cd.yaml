
name: POCAPP - CI & CD

on:
  # Valida pushes nas branches selecionadas. Uma mudança isolada nos values
  # segue direto para o Argo CD e não dispara outro build.
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - 'helm/pocapp/values.yaml'
  # Exibe os inputs no botão Run workflow do GitHub Actions.
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Destino da imagem publicada em main"
        type: choice
        options:
          - canary
          - stable
        default: stable
      image_delivery:
        description: "Entrega da imagem no ambiente"
        type: choice
        options:
          - harbor
          - minikube-local
        default: harbor

# Define o acesso padrão do token do workflow ao repositório.
permissions:
  contents: read

# A entrega usa, em ordem, o input manual, a variável do repositório e o padrão.
# A arquitetura vem da variável do repositório, com ARM64 como padrão.
env:
  POCAPP_IMAGE_PLATFORM: ${{ vars.POCAPP_IMAGE_PLATFORM || 'linux/arm64' }}
  POCAPP_IMAGE_DELIVERY: ${{ inputs.image_delivery || vars.POCAPP_IMAGE_DELIVERY || 'harbor' }}

# Agrupa execuções pela referência sem cancelar a que já está rodando.
concurrency:
  group: pocapp-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # 1. VALIDATE - NODE.JS + HELM
  # ============================================================
  validate:
    name: Node.js + Helm lint
    runs-on: ubuntu-latest

    steps:
      # Baixa a revisão que disparou o workflow no runner de validação.
      # Os testes e o Helm usam os arquivos desse mesmo commit.
      - name: Checkout
        uses: actions/checkout@v4

      # Seleciona Node.js 22 para executar os testes e o servidor.
      # A versão explícita evita depender do Node.js padrão do runner.
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Habilita Yarn Classic no runner Ubuntu, sem depender de instalação global.
      # Ativa o Yarn Classic 1.22.22 via Corepack.
      # Exibe a versão ativa no log para facilitar o diagnóstico.
      - name: Preparar Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      # Instala as dependências declaradas em app/package.json.
      # O yarn.lock deve estar versionado para builds reproduzíveis.
      # Instala as dependências na pasta app com o lockfile existente.
      # O modo frozen-lockfile impede que o CI atualize o yarn.lock para resolver divergências.
      - name: Instalar dependências com Yarn
        working-directory: app
        run: yarn install --frozen-lockfile

      # Executa os testes Vitest e gera app/coverage/lcov.info.
      # Executa o Vitest com coleta de cobertura e verifica os limiares configurados.
      # O relatório LCOV gerado será consumido pelo SonarQube.
      - name: Testes automatizados e cobertura
        working-directory: app
        run: yarn test:coverage

      # Disponibiliza a cobertura ao job SonarQube, que roda em outro runner.
      # Publica somente o LCOV como artefato para transferi-lo ao runner do SonarQube.
      # A etapa falha se o relatório estiver ausente e o artefato fica disponível por sete dias.
      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: pocapp-coverage
          path: app/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      # Instala a versão fixa do Helm usada no lint e na renderização.
      # Isso mantém a validação consistente entre execuções.
      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      # Confere se o JavaScript do servidor pode ser interpretado pelo Node.js.
      # Essa checagem detecta erros de sintaxe sem iniciar a API.
      - name: Verificar sintaxe Node.js
        run: node --check app/src/server.js

      # Inicia a API em segundo plano e aguarda uma resposta HTTP bem-sucedida em /healthz.
      # Falha se o processo morrer ou se a resposta não trouxer status healthy e uma versão.
      # O trap encerra o processo ao final, inclusive se o teste falhar.
      - name: Smoke test GET /healthz
        shell: bash
        run: |
          set -euo pipefail

          echo "Iniciando aplicação Node.js..."

          (cd app && node src/server.js) &
          APP_PID=$!

          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          echo "Aguardando API responder na porta 3000..."

          READY=false

          for i in {1..20}; do
            if curl --silent --fail \
              http://127.0.0.1:3000/healthz \
              > /tmp/healthz.json 2>/dev/null; then

              echo "API respondeu na tentativa $i"
              READY=true
              break
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "ERRO: Processo Node.js encerrou."
              exit 1
            fi

            sleep 1
          done

          if [[ "$READY" != "true" ]]; then
            echo "ERRO: API não respondeu após 20 tentativas."
            exit 1
          fi

          node -e '
            const d = require("/tmp/healthz.json");
            if (d.status !== "healthy" || !d.version) {
              console.error("Healthcheck inválido:", d);
              process.exit(1);
            }
            console.log("Healthcheck OK:", d);
          '

      # Executa o lint do chart para detectar problemas de estrutura e configuração.
      # A verificação roda no runner sem instalar recursos no Kubernetes.
      - name: Validar Helm Chart
        run: helm lint ./helm/pocapp

      # Renderiza os manifests para apps com os valores padrão e com um cenário de canary.
      # A renderização do canary usa peso 10 e uma tag de exemplo.
      # O teste exige arquivos não vazios nas duas renderizações.
      - name: Renderizar templates Helm
        run: |
          helm template pocapp ./helm/pocapp \
            --namespace apps \
            > /tmp/pocapp-rendered.yaml

          test -s /tmp/pocapp-rendered.yaml

          helm template pocapp ./helm/pocapp --namespace apps \
            --set canary.enabled=true,canary.weight=10 \
            --set-string canary.image.tag=sha-candidate \
            > /tmp/pocapp-canary-rendered.yaml

          test -s /tmp/pocapp-canary-rendered.yaml

  # ============================================================
  # 2. SONARQUBE + QUALITY GATE
  # ============================================================
  sonar:
    name: SonarQube + Quality Gate
    needs: validate
    runs-on: self-hosted
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

    steps:
      # Baixa a revisão no runner self-hosted com o histórico completo do Git.
      # O scanner pode usar o histórico para informações de autoria e análise de mudanças.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Seleciona Node.js 22 no runner que acessa o SonarQube.
      # Cada job prepara seu próprio ambiente de ferramentas.
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Registra a arquitetura e identifica o executável e a versão do Node.js.
      # Essas informações ajudam a diagnosticar diferenças no runner self-hosted.
      - name: Validar ambiente
        run: |
          echo "Arquitetura:"
          uname -m

          echo "Node.js:"
          which node
          node --version

      # Respeita uma URL personalizada do SonarQube. Sem URL ou com a URL HTTPS local
      # conhecida, abre um túnel em loopback até o Service do Minikube.
      # Aguarda a API indicar UP e exporta a URL dinâmica para o scanner e o Quality Gate.
      - name: Configurar acesso ao SonarQube
        shell: bash
        run: |
          set -euo pipefail
          sonar_url="${SONAR_HOST_URL:-}"
          case "${sonar_url%/}" in
            ''|https://sonarqube.localhost:8443) ;;
            *) exit 0 ;;
          esac

          forward_log=$(mktemp "$RUNNER_TEMP/sonar-forward.XXXXXX")
          kubectl --context minikube -n sonarqube port-forward --address 127.0.0.1 \
            svc/sonarqube-sonarqube :9000 > "$forward_log" 2>&1 &
          forward_pid=$!
          printf 'SONAR_FORWARD_PID=%s\n' "$forward_pid" >> "$GITHUB_ENV"

          for i in {1..25}; do
            if ! kill -0 "$forward_pid" 2>/dev/null; then break; fi
            port=$(sed -n 's/^Forwarding from 127\.0\.0\.1:\([0-9][0-9]*\) -> 9000$/\1/p' "$forward_log" | head -1)
            if [[ -n "$port" ]] && curl -fsS --max-time 3 --noproxy '*' \
              "http://127.0.0.1:$port/api/system/status" 2>/dev/null | jq -e '.status == "UP"' >/dev/null; then
              printf 'SONAR_HOST_URL=http://127.0.0.1:%s\n' "$port" >> "$GITHUB_ENV"
              printf 'NO_PROXY=127.0.0.1,localhost%s\n' "${NO_PROXY:+,$NO_PROXY}" >> "$GITHUB_ENV"
              printf 'no_proxy=127.0.0.1,localhost%s\n' "${no_proxy:+,$no_proxy}" >> "$GITHUB_ENV"
              printf 'SonarQube disponível por HTTP no túnel local do runner.\n'
              exit 0
            fi
            sleep 2
          done
          cat "$forward_log" >&2
          echo 'O SonarQube ainda não está acessível no contexto minikube.' >&2
          exit 1

      # Recupera a cobertura gerada no job validate (runner Ubuntu).
      # Baixa o artefato do job validate no diretório onde o scanner espera o LCOV.
      # Isso permite analisar a cobertura produzida em outro runner.
      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: pocapp-coverage
          path: app/coverage

      # Envia o código de app/src e o LCOV ao projeto pocapp no SonarQube.
      # O token de análise vem dos Secrets do GitHub Actions.
      - name: Analisar código no SonarQube
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        with:
          projectBaseDir: app
          args: >-
            -Dsonar.projectKey=pocapp
            -Dsonar.projectName=pocapp
            -Dsonar.sources=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Consulta o resultado da análise usando o identificador salvo pelo scanner.
      # Aguarda até 300 segundos pelo Quality Gate, cuja aprovação libera o build.
      - name: Aguardar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: app/.scannerwork/report-task.txt
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Fecha o port-forward se este job abriu um túnel local.
      # A condição always executa a limpeza mesmo após falha de uma etapa anterior.
      - name: Encerrar acesso local ao SonarQube
        if: always()
        shell: bash
        run: |
          if [[ -n "${SONAR_FORWARD_PID:-}" ]]; then
            kill "$SONAR_FORWARD_PID" 2>/dev/null || true
          fi

  # ============================================================
  # 3. DOCKER BUILD + TRIVY + HARBOR
  # ============================================================
  image:
    name: Docker Build + Trivy
    needs: sonar
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      # Baixa a revisão que disparou o workflow no runner de build.
      # O Docker usa a pasta app desse checkout como contexto.
      - name: Checkout
        uses: actions/checkout@v4

      # Valida a arquitetura alvo e o modo de entrega antes do build.
      # A imagem deve usar linux/amd64 ou linux/arm64 e seguir para Harbor ou Minikube local.
      - name: Verificar plataforma e destino da imagem
        shell: bash
        run: |
          case "$POCAPP_IMAGE_PLATFORM" in
            linux/amd64|linux/arm64) ;;
            *) echo 'Defina POCAPP_IMAGE_PLATFORM como linux/amd64 ou linux/arm64.' >&2; exit 1 ;;
          esac
          case "$POCAPP_IMAGE_DELIVERY" in
            harbor|minikube-local) ;;
            *) echo 'Defina POCAPP_IMAGE_DELIVERY como harbor ou minikube-local.' >&2; exit 1 ;;
          esac

      # Habilita QEMU somente quando a imagem de destino é ARM64.
      # A emulação permite construir para essa arquitetura no runner hospedado.
      - name: Preparar emulação ARM64
        if: env.POCAPP_IMAGE_PLATFORM == 'linux/arm64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Configura o builder Buildx usado para construir para a plataforma selecionada.
      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Monta uma tag rastreável com os 12 primeiros caracteres do SHA de origem.
      # Publica a tag como output para o build e os jobs seguintes.
      - name: Definir tag da imagem
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="sha-${GITHUB_SHA::12}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Imagem: $TAG"

      # Constrói a imagem na plataforma selecionada e a carrega no Docker do runner.
      # O Trivy examina essa imagem local e o docker save exporta o mesmo artefato.
      - name: Build da imagem Docker
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          docker buildx build \
            --platform "$POCAPP_IMAGE_PLATFORM" \
            --load \
            -t "healthz-api:$TAG" \
            ./app

      # Gera um relatório de vulnerabilidades HIGH e CRITICAL em pacotes do SO e bibliotecas.
      # Ignora achados sem correção disponível. O exit-code 0 torna os achados informativos.
      - name: Trivy - relatar HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: healthz-api:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      # Empacota a imagem em um arquivo tar quando a execução está na main.
      # O próximo runner recebe a imagem já construída, sem precisar repetir o build.
      - name: Exportar imagem para entrega
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: docker save --output "$RUNNER_TEMP/pocapp-image.tar" "healthz-api:$TAG"

      # Publica o tar para o job de entrega no runner self-hosted.
      # O artefato fica disponível por sete dias e pode ser substituído em uma reexecução.
      - name: Enviar imagem como artefato
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pocapp-image
          path: ${{ runner.temp }}/pocapp-image.tar
          retention-days: 7
          overwrite: true

  # A entrega roda apenas na main, no runner que alcança os serviços locais.
  publish:
    name: Entregar imagem ao Harbor ou ao Minikube
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    outputs:
      repository: ${{ steps.reference.outputs.repository }}
      tag: ${{ needs.image.outputs.tag }}
    env:
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      # Define o nome da imagem que será gravado no GitOps.
      # No Harbor valida o host e o projeto e monta registry/projeto/healthz-api.
      # Na entrega local mantém apenas healthz-api, pois o artefato vai direto para o nó.
      - name: Definir referência da imagem
        id: reference
        env:
          REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          PROJECT: ${{ vars.HARBOR_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$POCAPP_IMAGE_DELIVERY" == 'harbor' ]]; then
            : "${REGISTRY:?Configure HARBOR_REGISTRY como hostname[:porta].}"
            : "${PROJECT:?Configure HARBOR_PROJECT.}"
            if [[ "$REGISTRY" == *://* || "$REGISTRY" == */* || "$REGISTRY" =~ [[:space:]] ]]; then
              echo 'HARBOR_REGISTRY deve conter somente hostname[:porta], sem protocolo, barra ou espaços.' >&2
              exit 1
            fi
            if [[ ! "$REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]{1,5})?$ ]]; then
              echo 'Formato inválido para HARBOR_REGISTRY.' >&2
              exit 1
            fi
            PROJECT="${PROJECT#/}"
            PROJECT="${PROJECT%/}"
            if [[ ! "$PROJECT" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
              echo 'HARBOR_PROJECT deve ser um nome de projeto válido, sem barras.' >&2
              exit 1
            fi
            printf 'registry=%s\n' "$REGISTRY" >> "$GITHUB_OUTPUT"
            REPOSITORY="${REGISTRY}/${PROJECT}/healthz-api"
            printf 'repository=%s\n' "$REPOSITORY" >> "$GITHUB_OUTPUT"
            echo "Repositório definido: $REPOSITORY"
          else
            printf 'repository=healthz-api\n' >> "$GITHUB_OUTPUT"
          fi

      # Recupera o tar do build em um diretório temporário associado à execução.
      # A mesma imagem segue para importação no Minikube ou publicação no Harbor.
      - name: Baixar a imagem construída no GitHub
        uses: actions/download-artifact@v4
        with:
          name: pocapp-image
          path: ${{ runner.temp }}/pocapp-image-${{ github.run_id }}

      # Confere primeiro se a arquitetura da imagem é compatível com o nó.
      # Depois importa o tar para o perfil minikube e confirma que a tag está disponível no nó.
      - name: Importar imagem no Minikube
        if: env.POCAPP_IMAGE_DELIVERY == 'minikube-local'
        shell: bash
        run: |
          set -euo pipefail
          node_platform=$(kubectl --context minikube get nodes \
            -o jsonpath='{.items[0].status.nodeInfo.operatingSystem}{"/"}{.items[0].status.nodeInfo.architecture}')
          [[ "$node_platform" == "$POCAPP_IMAGE_PLATFORM" ]] || {
            echo "O nó usa $node_platform. Ajuste POCAPP_IMAGE_PLATFORM." >&2; exit 1;
          }
          minikube -p minikube image load "$RUNNER_TEMP/pocapp-image-$GITHUB_RUN_ID/pocapp-image.tar"
          minikube -p minikube image ls | awk -v image="healthz-api:$TAG" '
            $0 == image || $0 == "docker.io/" image || $0 == "docker.io/library/" image { found = 1 }
            END { exit !found }
          '

      # Carrega o tar no daemon Docker do runner self-hosted no modo Harbor.
      # A inspeção verifica a presença da tag esperada antes de renomear e publicar.
      - name: Carregar imagem Docker para publicar no Harbor
        if: env.POCAPP_IMAGE_DELIVERY == 'harbor'
        shell: bash
        run: |
          set -euo pipefail
          docker load -i "$RUNNER_TEMP/pocapp-image-$GITHUB_RUN_ID/pocapp-image.tar"
          docker image inspect "healthz-api:${TAG}" > /dev/null

      # Valida o túnel HTTP direto em 8081 quando o registry é host.docker.internal.
      # Confere a resposta 401 com o endpoint de token esperado, testa que HTTPS
      # não responde nesse túnel e verifica a configuração insecure-registries do Docker Desktop.
      - name: Verificar o túnel direto do Harbor local
        if: env.POCAPP_IMAGE_DELIVERY == 'harbor' && steps.reference.outputs.registry == 'host.docker.internal:8081'
        shell: bash
        run: |
          set -euo pipefail
          headers=$(curl --noproxy '*' -sS --max-time 5 -D - -o /dev/null \
            -H 'Host: host.docker.internal:8081' http://127.0.0.1:8081/v2/ || true)
          if ! grep -Eq '^HTTP/[0-9.]+ 401 ' <<< "$headers" ||
             ! grep -iFq 'realm="http://host.docker.internal:8081/service/token"' <<< "$headers" ||
             curl --noproxy '*' -ksS --max-time 3 -o /dev/null https://127.0.0.1:8081/v2/ 2>/dev/null; then
            echo 'Mantenha o provisionador com --servir na máquina do runner. A porta 8081 precisa encaminhar HTTP direto ao Service harbor.' >&2
            exit 1
          fi
          if [[ "$(docker info --format '{{json .RegistryConfig.IndexConfigs}}' |
            jq -r '."host.docker.internal:8081".Secure')" != false ]]; then
            echo 'Adicione host.docker.internal:8081 à lista insecure-registries do Docker Desktop.' >&2
            exit 1
          fi

      # Autentica o Docker no registry indicado para autorizar a publicação.
      # As credenciais vêm dos Secrets do GitHub Actions.
      - name: Login no Harbor
        if: env.POCAPP_IMAGE_DELIVERY == 'harbor'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.reference.outputs.registry }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Aplica o nome completo do registry à imagem local sem reconstruí-la.
      # Envia ao Harbor a mesma tag derivada da revisão de origem.
      - name: Publicar imagem no Harbor
        if: env.POCAPP_IMAGE_DELIVERY == 'harbor'
        env:
          REPOSITORY: ${{ steps.reference.outputs.repository }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REPOSITORY}:${TAG}"
          echo "Imagem local: healthz-api:${TAG}"
          echo "Publicando imagem: ${IMAGE}"
          docker image inspect "healthz-api:${TAG}" > /dev/null
          docker tag "healthz-api:${TAG}" "${IMAGE}"
          docker push "${IMAGE}"

      # Consulta se o projeto do Harbor local é público.
      # Quando for público, executa o pull pelo runtime dentro do nó Minikube
      # para testar o caminho que o Kubernetes usará antes de atualizar o Git.
      - name: Verificar pull da imagem pública no Minikube
        if: env.POCAPP_IMAGE_DELIVERY == 'harbor' && steps.reference.outputs.registry == 'host.docker.internal:8081'
        env:
          REPOSITORY: ${{ steps.reference.outputs.repository }}
          PROJECT: ${{ vars.HARBOR_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          project_info=$(curl --noproxy '*' -sS --max-time 8 -H 'Host: host.docker.internal:8081' \
            "http://127.0.0.1:8081/api/v2.0/projects/$PROJECT")
          if jq -e '.metadata.public | . == "true" or . == true' >/dev/null <<< "$project_info"; then
            docker exec minikube crictl pull "$REPOSITORY:$TAG"
          fi

  # ============================================================
  # 4. GITOPS - ATUALIZAR HELM VALUES
  # ============================================================
  # O Git só recebe a nova referência depois da entrega da imagem.
  gitops:
    name: GitOps - Atualizar imagem no Helm
    needs: publish

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    concurrency:
      group: pocapp-gitops-main
      cancel-in-progress: false

    outputs:
      revision: ${{ steps.commit.outputs.revision }}

    permissions:
      contents: write

    steps:
      # Faz checkout de main, que é a branch acompanhada pelo Argo CD.
      # Mantém as credenciais do checkout disponíveis para o push do bot.
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      # Prepara o Python 3.12 para editar os values do Helm de forma estruturada.
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Instala uma versão fixa do ruamel.yaml para editar o YAML preservando
      # a estrutura e, sempre que possível, a apresentação do arquivo.
      - name: Instalar ruamel.yaml
        run: python -m pip install 'ruamel.yaml==0.18.10'

      # Atualiza somente a referência da imagem no values.yaml, após a entrega.
      # Recusa a alteração se já houver canary ativo. A candidata começa com peso zero.
      # Na entrega local define IfNotPresent para usar a imagem disponível no nó.
      - name: Atualizar imagem no values.yaml
        env:
          REPOSITORY: ${{ needs.publish.outputs.repository }}
          TAG: ${{ needs.publish.outputs.tag }}
          DEPLOY_TARGET: ${{ inputs.deploy_target || 'stable' }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path
          from ruamel.yaml import YAML

          path = Path("helm/pocapp/values.yaml")

          yaml = YAML()
          yaml.preserve_quotes = True

          with path.open(encoding="utf-8") as f:
              values = yaml.load(f)

          canary = values["canary"]
          if canary["enabled"]:
              raise SystemExit("Há um canary ativo. Finalize a promoção ou o aborto pelo Git.")

          image = {
              "repository": os.environ["REPOSITORY"],
              "tag": os.environ["TAG"],
          }
          if os.environ["POCAPP_IMAGE_DELIVERY"] == "minikube-local":
              image["pullPolicy"] = "IfNotPresent"
          if os.environ["DEPLOY_TARGET"] == "canary":
              canary["image"].update(image)
              canary["enabled"] = True
              canary["weight"] = 0
          else:
              values["image"].update(image)

          with path.open("w", encoding="utf-8") as f:
              yaml.dump(values, f)

          print("Imagem atualizada no Helm values.yaml")
          PY

      # Adiciona apenas o values.yaml ao commit e faz push para main se houver alteração.
      # Publica a revisão GitOps no output para rastrear o estado que o Argo CD vai ler.
      - name: Commit e push na main
        id: commit
        env:
          TAG: ${{ needs.publish.outputs.tag }}
          DEPLOY_TARGET: ${{ inputs.deploy_target || 'stable' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add helm/pocapp/values.yaml

          if git diff --cached --quiet; then
            echo "Imagem já configurada. Nenhuma alteração necessária."
          else
            git commit -m "ci(pocapp): deploy $DEPLOY_TARGET image $TAG"
            git push origin HEAD:main
            echo "GitOps atualizado. O Argo CD realizará a sincronização automática."
          fi

          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Resume inclusive falhas e etapas ignoradas, se a execução não for cancelada.
  summary:
    name: Resumo do pipeline
    if: ${{ !cancelled() }}
    needs: [validate, sonar, image, publish, gitops]
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      # Escreve o Summary da execução com o status de cada job e os outputs disponíveis.
      # Registra separadamente a origem, a imagem entregue e a revisão GitOps.
      # A saúde do rollout é confirmada no Argo CD, após o commit.
      - name: Registrar resultado da execução
        env:
          DEPLOY_TARGET: ${{ inputs.deploy_target || 'stable' }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SONAR_RESULT: ${{ needs.sonar.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          GITOPS_RESULT: ${{ needs.gitops.result }}
          IMAGE_TAG: ${{ needs.image.outputs.tag }}
          IMAGE_REPOSITORY: ${{ needs.publish.outputs.repository }}
          GITOPS_REVISION: ${{ needs.gitops.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail

          status_label() {
            case "$1" in
              success)   printf '✅ Sucesso' ;;
              failure)   printf '❌ Falhou' ;;
              cancelled) printf '⏹️ Cancelado' ;;
              skipped)   printf '⏭️ Ignorado' ;;
              *)         printf '—' ;;
            esac
          }

          {
            printf '## CI/CD da POCAPP\n\n'
            printf -- '- Branch `%s` e revisão de origem `%s`\n' "$GITHUB_REF_NAME" "${GITHUB_SHA:0:12}"
            printf -- '- Destino `%s`, entrega `%s`, plataforma `%s`\n' \
              "$DEPLOY_TARGET" "$POCAPP_IMAGE_DELIVERY" "$POCAPP_IMAGE_PLATFORM"
            if [[ "$PUBLISH_RESULT" == success && -n "$IMAGE_REPOSITORY" && -n "$IMAGE_TAG" ]]; then
              printf -- '- Imagem entregue `%s:%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_TAG"
            elif [[ "$IMAGE_RESULT" == success && -n "$IMAGE_TAG" ]]; then
              printf -- '- Tag gerada no build `%s`\n' "$IMAGE_TAG"
            fi
            if [[ "$GITOPS_RESULT" == success && -n "$GITOPS_REVISION" ]]; then
              printf -- '- Revisão GitOps [`%s`](%s/%s/commit/%s)\n' \
                "${GITOPS_REVISION:0:12}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITOPS_REVISION"
            fi

            printf '\n| Etapa | Resultado |\n| --- | --- |\n'
            printf '| Node.js e Helm | %s |\n' "$(status_label "$VALIDATE_RESULT")"
            printf '| SonarQube e Quality Gate | %s |\n' "$(status_label "$SONAR_RESULT")"
            printf '| Docker build e relatório Trivy | %s |\n' "$(status_label "$IMAGE_RESULT")"
            printf '| Entrega da imagem | %s |\n' "$(status_label "$PUBLISH_RESULT")"
            printf '| Atualização GitOps | %s |\n' "$(status_label "$GITOPS_RESULT")"

            if [[ "$GITOPS_RESULT" == success ]]; then
              printf '\nConfira a sincronização e a saúde da POCAPP no Argo CD para validar o deploy.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
