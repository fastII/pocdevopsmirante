
name: POCAPP - CI & CD

on:
  push:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: pocapp-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ============================================================
  # 1. VALIDATE - NODE.JS + HELM
  # ============================================================
  validate:
    name: Node.js + Helm lint
    runs-on: arc-minikube
    #runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Verificar sintaxe Node.js
        run: node --check app/src/server.js

      - name: Smoke test GET /healthz
        shell: bash
        run: |
          set -euo pipefail

          echo "Iniciando aplicação Node.js..."

          (cd app && node src/server.js) &
          APP_PID=$!

          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          echo "Aguardando API responder na porta 3000..."

          READY=false

          for i in {1..20}; do
            if curl --silent --fail \
              http://127.0.0.1:3000/healthz \
              > /tmp/healthz.json 2>/dev/null; then

              echo "API respondeu na tentativa $i"
              READY=true
              break
            fi

            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "ERRO: Processo Node.js encerrou."
              exit 1
            fi

            sleep 1
          done

          if [[ "$READY" != "true" ]]; then
            echo "ERRO: API não respondeu após 20 tentativas."
            exit 1
          fi

          node -e '
            const d = require("/tmp/healthz.json");
            if (d.status !== "healthy") {
              console.error("Healthcheck inválido:", d);
              process.exit(1);
            }
            console.log("Healthcheck OK:", d);
          '

      - name: Validar Helm Chart
        run: helm lint ./helm/pocapp

      - name: Renderizar templates Helm
        run: |
          helm template pocapp ./helm/pocapp \
            --namespace apps \
            > /tmp/pocapp-rendered.yaml

          test -s /tmp/pocapp-rendered.yaml

  # ============================================================
  # 2. SONARQUBE + QUALITY GATE
  # ============================================================
  sonar:
    name: SonarQube + Quality Gate
    needs: validate
    runs-on: arc-minikube


    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar ambiente
        run: |
          echo "Arquitetura:"
          uname -m

          echo "Node.js:"
          which node
          node --version

      - name: Analisar código no SonarQube
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        with:
          projectBaseDir: app
          args: >-
            -Dsonar.projectKey=pocapp
            -Dsonar.projectName=pocapp
            -Dsonar.sources=src
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Aguardar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          scanMetadataReportFile: app/.scannerwork/report-task.txt
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # ============================================================
  # 3. DOCKER BUILD + TRIVY + HARBOR
  # ============================================================
  image:
    name: Docker Build + Trivy + Harbor
    needs: sonar
    runs-on: arc-minikube

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Definir tag da imagem
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          TAG="sha-${GITHUB_SHA::12}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Imagem: $TAG"

      - name: Build da imagem Docker
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          docker buildx build \
            --load \
            -t "pocapp-scan:$TAG" \
            ./app

      - name: Trivy - bloquear HIGH/CRITICAL
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pocapp-scan:${{ steps.meta.outputs.tag }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      # Publicação somente na branch main
      - name: Login no Harbor
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Publicar imagem no Harbor
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          PROJECT: ${{ vars.HARBOR_PROJECT }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$PROJECT/healthz-api:$TAG"

          echo "Publicando imagem: $IMAGE"

          docker tag "pocapp-scan:$TAG" "$IMAGE"
          docker push "$IMAGE"

  # ============================================================
  # 4. GITOPS - ATUALIZAR HELM VALUES
  # ============================================================
  gitops:
    name: GitOps - Atualizar imagem no Helm
    needs: image

    if: github.ref == 'refs/heads/main'

    runs-on: arc-minikube

    permissions:
      contents: write

    steps:
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar ruamel.yaml
        run: python -m pip install 'ruamel.yaml==0.18.10'

      - name: Atualizar imagem no values.yaml
        env:
          REGISTRY: ${{ vars.HARBOR_REGISTRY }}
          PROJECT: ${{ vars.HARBOR_PROJECT }}
          TAG: ${{ needs.image.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path
          from ruamel.yaml import YAML

          path = Path("helm/pocapp/values.yaml")

          yaml = YAML()
          yaml.preserve_quotes = True

          with path.open(encoding="utf-8") as f:
              values = yaml.load(f)

          values["image"]["repository"] = (
              f"{os.environ['REGISTRY']}/"
              f"{os.environ['PROJECT']}/healthz-api"
          )

          values["image"]["tag"] = os.environ["TAG"]

          with path.open("w", encoding="utf-8") as f:
              yaml.dump(values, f)

          print("Imagem atualizada no Helm values.yaml")
          PY

      - name: Commit e push na main
        env:
          TAG: ${{ needs.image.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add helm/pocapp/values.yaml

          if git diff --cached --quiet; then
            echo "Imagem já configurada. Nenhuma alteração necessária."
            exit 0
          fi

          git commit -m "ci(pocapp): deploy image $TAG"

          git push origin HEAD:main

          echo "GitOps atualizado."
          echo "Argo CD realizará a sincronização automática."
