
name: Rollback POCAPP

on:
  # Exibe os inputs no botão Run workflow do GitHub Actions.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da última imagem saudável"
        required: true
        type: string
      image_repository:
        description: "Repositório anterior da imagem, se diferente do atual"
        required: false
        type: string
      image_pull_policy:
        description: "Política da versão anterior"
        type: choice
        options:
          - manter
          - IfNotPresent
          - Always
          - Never
        default: manter

# Define o acesso padrão do token do workflow ao repositório.
permissions:
  contents: write

jobs:
  # O rollback roda na main e usa o mesmo grupo de concorrência da publicação
  # GitOps para que os dois jobs não gravem em main ao mesmo tempo.
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pocapp-gitops-main
      cancel-in-progress: false

    steps:
      # Faz checkout de main para restaurar a referência no estado desejado atual.
      # Mantém as credenciais do checkout disponíveis para publicar o commit do bot.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      # Instala uma versão fixa do yq de Mike Farah no runner Ubuntu.
      # A ferramenta permite consultar e editar campos do YAML sem substituições de texto.
      - name: Instalar yq
        run: |
          YQ_VERSION=v4.44.6
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq

      # Restaura a referência estável no values.yaml. A tag é obrigatória.
      # Quando o repositório é omitido ou a política é manter, reaproveita os valores existentes.
      # Valida as entradas e interrompe se houver um canary ativo, para preservar a sequência de promoção ou aborto.
      - name: Restaurar a referência da imagem estável
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_REPOSITORY: ${{ inputs.image_repository }}
          IMAGE_PULL_POLICY: ${{ inputs.image_pull_policy }}
        shell: bash
        run: |
          set -euo pipefail
          values=helm/pocapp/values.yaml
          if [[ "$(yq '.canary.enabled' "$values")" == true ]]; then
            echo 'Há um canary ativo. Encerre o canary pelo Git antes de restaurar a tag estável.' >&2
            exit 1
          fi
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'Informe uma tag de imagem válida em image_tag.' >&2
            exit 1
          fi
          if [[ -n "$IMAGE_REPOSITORY" ]]; then
            if [[ ! "$IMAGE_REPOSITORY" =~ ^[a-z0-9][a-z0-9._-]*(:[0-9]{1,5})?(/[a-z0-9][a-z0-9._-]*)*$ ||
                  ( "$IMAGE_REPOSITORY" == *:* && "$IMAGE_REPOSITORY" != */* ) ]]; then
              echo 'Informe um repositório de imagem sem protocolo, tag ou digest em image_repository.' >&2
              exit 1
            fi
          else
            IMAGE_REPOSITORY=$(yq -er '.image.repository' "$values")
          fi
          case "$IMAGE_PULL_POLICY" in
            manter) IMAGE_PULL_POLICY=$(yq -er '.image.pullPolicy' "$values") ;;
            IfNotPresent|Always|Never) ;;
            *) echo 'Política de pull inválida.' >&2; exit 1 ;;
          esac

          yq -i '.image.repository = strenv(IMAGE_REPOSITORY) |
            .image.tag = strenv(IMAGE_TAG) |
            .image.pullPolicy = strenv(IMAGE_PULL_POLICY)' "$values"
          printf 'Imagem estável selecionada: %s:%s (%s)\n' "$IMAGE_REPOSITORY" "$IMAGE_TAG" "$IMAGE_PULL_POLICY"

      # Publica em main somente quando há mudança no values.yaml.
      # O Argo CD reconcilia a referência restaurada. Depois acompanhe o rollout e confirme a tag no /healthz.
      - name: Commit e push
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/pocapp/values.yaml

          if git diff --cached --quiet; then
            echo "Tag já configurada."
            exit 0
          fi

          git commit -m "rollback(pocapp): restore image $IMAGE_TAG"

          git push origin HEAD:main

