configs:
  params:
    server.insecure: true
  cm:
    # O chart do Harbor gera chaves e hashes novos a cada renderização.
    # RespectIgnoreDifferences mantém os valores já instalados durante o sync.
    resource.customizations.ignoreDifferences._Secret: |
      jqPathExpressions:
        - select(.metadata.namespace == "harbor" and .metadata.name == "harbor-core") | .data | (.secret, .CSRF_KEY, ."tls.crt", ."tls.key")
        - select(.metadata.namespace == "harbor" and .metadata.name == "harbor-jobservice") | .data.JOBSERVICE_SECRET
        - select(.metadata.namespace == "harbor" and .metadata.name == "harbor-registry") | .data.REGISTRY_HTTP_SECRET
        - select(.metadata.namespace == "harbor" and .metadata.name == "harbor-registry-htpasswd") | .data.REGISTRY_HTPASSWD
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jqPathExpressions:
        - select(.metadata.namespace == "harbor" and (.metadata.name | IN("harbor-core", "harbor-jobservice", "harbor-registry"))) | .spec.template.metadata.annotations | (."checksum/secret", ."checksum/secret-core", ."checksum/secret-jobservice")

server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

controller:
  resources:
    requests:
      cpu: 300m
      memory: 640Mi
    limits:
      cpu: "1"
      memory: 1Gi

repoServer:
  readinessProbe:
    timeoutSeconds: 5
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

notifications:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 192Mi

dex:
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
