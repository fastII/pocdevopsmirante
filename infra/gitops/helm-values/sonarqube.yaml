community:
  enabled: true
# O chart 2026.5.1005 não inclui PostgreSQL. Para uso além da POC,
# provisione o banco separadamente e configure jdbcOverwrite + Secret.
persistence:
  enabled: true
  storageClass: standard
  accessMode: ReadWriteOnce
  size: 10Gi
service:
  type: ClusterIP
ingress:
  enabled: false
monitoringPasscodeSecretName: sonarqube-monitoring
monitoringPasscodeSecretKey: monitoringPasscode
resources:
  requests:
    cpu: 400m
    memory: 1536Mi
    ephemeral-storage: 2Gi
  limits:
    cpu: 1500m
    memory: 2Gi
    ephemeral-storage: 10Gi
initContainers:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
initSysctl:
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi
initFs:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
