community:
  enabled: true
postgresql:
  enabled: true
  auth:
    username: sonar
    database: sonarqube
    existingSecret: sonarqube-postgresql
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  persistence:
    enabled: true
    storageClass: standard
    accessMode: ReadWriteOnce
    size: 10Gi
  primary:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
persistence:
  enabled: true
  storageClass: standard
  accessMode: ReadWriteOnce
  size: 10Gi
service:
  type: ClusterIP
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
  - name: sonarqube.local
    path: /
  tls: []
monitoringPasscodeSecretName: sonarqube-monitoring
monitoringPasscodeSecretKey: monitoringPasscode
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 2Gi
