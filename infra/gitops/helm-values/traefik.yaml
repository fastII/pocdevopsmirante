accessLog:
  enabled: true
api:
  dashboard: true
  insecure: false
gateway:
  listeners:
    web:
      namespacePolicy:
        from: All
      port: 80
      protocol: HTTP
    websecure:
      certificateRefs:
      - group: ''
        kind: Secret
        name: local-selfsigned-tls
      mode: Terminate
      namespacePolicy:
        from: All
      port: 443
      protocol: HTTPS
  enabled: true
ingressClass:
  enabled: false
ingressRoute:
  dashboard:
    enabled: false
    entryPoints:
    - websecure
    matchRule: Host(`dashboard.docker.localhost`)
    middlewares:
    - name: dashboard-auth
log:
  level: INFO
metrics:
  prometheus:
    enabled: true
ports:
  web:
    http:
      redirections:
        entryPoint:
          permanent: true
          scheme: https
          to: websecure
    nodePort: 30000
    port: 80
  websecure:
    nodePort: 30001
    port: 443
providers:
  kubernetesGateway:
    enabled: true
    experimentalChannel: false 
  kubernetesIngress:
    enabled: false
gatewayClass:
  enabled: true
  name: traefik
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
