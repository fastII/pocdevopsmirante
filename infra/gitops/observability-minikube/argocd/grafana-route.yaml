apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-grafana-route
  namespace: argocd
spec:
  project: observability
  source:
    repoURL: https://github.com/fastII/pocdevopsmirante.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
