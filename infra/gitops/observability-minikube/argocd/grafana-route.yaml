apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-grafana-route
  namespace: argocd
spec:
  project: observability

  source:
    repoURL: https://github.com/fastII/pocdevopsmirante.git
    targetRevision: main

    # CORRIGIDO: caminho completo a partir da raiz do repositório
    path: infra/gitops/applications/observability-minikube/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true