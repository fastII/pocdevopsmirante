# ADAPTADO: altere para a organizacao ou repositorio que instalou o GitHub App.
githubConfigUrl: https://github.com/bs2-bet
# Secret nativo Kubernetes (criado via kubectl, NAO versionar a chave privada).
githubConfigSecret: arc-github-app
runnerScaleSetName: arc-bs2bet

# ADAPTADO: escala conservadora para POC no Minikube.
minRunners: 0
maxRunners: 1

# PRESERVADO: ServiceAccount criado pelo chart do controller, release 'arc'.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller

# ADAPTADO: DinD gerenciado pelo chart, sem imagem antiga pinada por digest.
# Exige permissao privileged no namespace arc-runners.
containerMode:
  type: dind

listenerTemplate:
  spec:
    containers:
      - name: listener
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

# ADICIONADO: orçamento do pod cobre conjuntamente runner e sidecar DinD.
template:
  spec:
    # Kubernetes 1.37: limita o orçamento conjunto de runner + DinD.
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        cpu: 1500m
        memory: 2Gi
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
