apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-minikube
  namespace: argocd
spec:
  project: arc
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2 # PRESERVADO do ZIP original; validar disponibilidade no GHCR
    helm:
      releaseName: arc-minikube
      valuesObject:
        # ALTERAR: URL do repositorio em que o GitHub App foi instalado #
        githubConfigUrl: https://github.com/fastII/pocdevopsmirante
        # ADICIONADO: Kubernetes Secret nativo, sem External Secrets
        githubConfigSecret: arc-github-app
        runnerScaleSetName: arc-minikube
        # ALTERADO: escala reduzida para POC
        minRunners: 0
        maxRunners: 1
        controllerServiceAccount:
          namespace: arc-systems
          name: arc-gha-rs-controller
        # ALTERADO: DinD nativo do chart, sem dependencias AWS
        containerMode:
          type: dind
        listenerTemplate:
          spec:
            containers:
              - name: listener
                resources:
                  requests:
                    cpu: 25m
                    memory: 64Mi
                  limits:
                    cpu: 200m
                    memory: 256Mi
        template:
          spec:
            resources:
              requests:
                cpu: 500m
                memory: 768Mi
              limits:
                cpu: 1500m
                memory: 2Gi
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:latest
                command: ["/home/runner/run.sh"]
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    cpu: '1'
                    memory: 1Gi
  destination:
    server: https://kubernetes.default.svc # ALTERADO: EKS -> Minikube
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
