# OPCIONAL: restringe conexoes de entrada para pods de runners.
# Nao aplica egress restritivo do EKS: ele pode bloquear DNS/GitHub no Minikube.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: arc-runners
spec:
  podSelector: {}
  policyTypes:
    - Ingress
