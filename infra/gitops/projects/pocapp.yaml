apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pocapp
  namespace: argocd
spec:
  description: Aplicacao Node.js pocapp - POC DevOps Mirante
  sourceRepos:
    - https://github.com/fastII/pocdevopsmirante.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: apps
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'