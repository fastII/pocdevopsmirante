apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pocapp
  namespace: argocd
spec:
  description: Projeto GitOps da POC

  sourceRepos:
    - '*'

  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
