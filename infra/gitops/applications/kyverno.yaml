apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: kyverno
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # CONFIRMAR versão compatível com seu Kubernetes: helm search repo kyverno/kyverno --versions
    targetRevision: 3.10.0
    helm:
      releaseName: kyverno
      valuesObject:
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
        reportsController:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
