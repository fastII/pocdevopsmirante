apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-routes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fastII/pocdevopsmirante.git
    targetRevision: main
    path: infra/gitops/routes
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
