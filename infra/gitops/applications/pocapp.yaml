apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pocapp
  namespace: argocd
spec:
  project: pocapp
  source:
    repoURL: https://github.com/fastII/pocdevopsmirante.git
    targetRevision: main
    path: helm/pocapp
    helm:
      releaseName: pocapp
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated:
      prune: false # Evita exclusões automáticas nesta POC
      selfHeal: true
    syncOptions:
      - CreateNamespace=false # O namespace apps deve existir
