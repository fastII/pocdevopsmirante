apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
spec:
  project: kyverno
  source:
    repoURL: https://github.com/fastII/pocdevopsmirante.git
    targetRevision: main
    path: infra/gitops/security/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
