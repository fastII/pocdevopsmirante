apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/fastII/pocdevopsmirante.git
    targetRevision: main
    path: infra/gitops/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      name: platform-routes
      namespace: argocd
      jqPathExpressions:
        # O Argo CD pode omitir o bloco directory quando contém só o valor padrão.
        - '.spec.source.directory | select(. == {"recurse": false})'

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
