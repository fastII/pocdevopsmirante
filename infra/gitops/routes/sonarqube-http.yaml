apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarqube-http
  namespace: sonarqube
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - sonarqube.localhost
  rules:
    - backendRefs:
        - name: sonarqube-sonarqube
          port: 9000
